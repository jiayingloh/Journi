name: Build iOS Simulator App

on:
  workflow_dispatch: 

jobs:
  build_ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator App
        run: flutter build ios --simulator

      - name: Zip the .app bundle
        run: |
          # 1. Search for the actual location of Runner.app because Flutter moves it between versions
          APP_DIR=$(find build/ios -name "Runner.app" -type d | head -n 1)
          
          if [ -z "$APP_DIR" ]; then
            echo "Failed to find Runner.app! Listing directory contents:"
            find build/ios
            exit 1
          fi
          
          echo "Found app bundle at: $APP_DIR"
          
          # 2. Extract the parent folder path so we can cleanly zip it
          PARENT_DIR=$(dirname "$APP_DIR")
          cd "$PARENT_DIR"
          
          # 3. Zip the app folder
          zip -r JourniApp.zip Runner.app
          
          # 4. Save the absolute path of the zip as an environment variable for the next step!
          echo "ZIP_PATH=$PWD/JourniApp.zip" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app-zip
          path: ${{ env.ZIP_PATH }}
